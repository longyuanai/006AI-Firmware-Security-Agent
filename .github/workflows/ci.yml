name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Check out firmware agent
        uses: actions/checkout@v6
        with:
          path: 006AI-Firmware-Security-Agent

      - name: Check out shared LLM core
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/000shared-llm-core
          path: 000shared-llm-core
          token: ${{ secrets.SHARED_CORE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install squashfs tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Install project
        working-directory: 006AI-Firmware-Security-Agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry>=2.1,<3"
          poetry install --no-interaction

      - name: Lint
        working-directory: 006AI-Firmware-Security-Agent
        run: poetry run ruff check src tests

      - name: Type check
        working-directory: 006AI-Firmware-Security-Agent
        run: poetry run mypy

      - name: Test
        working-directory: 006AI-Firmware-Security-Agent
        env:
          MPLCONFIGDIR: .mplconfig
        run: poetry run pytest --basetemp=.pytest-tmp
