services:
  firmware-agent:
    image: ai-firmware-agent:0.1
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        shared: ../000shared-llm-core
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
      - ./samples:/firmware:ro
      - ./output:/output
    command: ["--help"]
