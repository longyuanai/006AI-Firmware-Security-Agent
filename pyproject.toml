[tool.poetry]
name = "ai-firmware-agent"
version = "0.1.0"
description = "AI firmware security analyzer — sixth project of the longyuanai suite"
authors = ["longyuanai"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ai_firmware_agent", from = "src" }]
# PEP 561: ship the inline types mypy already enforces on this source.
include = [
    { path = "src/ai_firmware_agent/py.typed", format = ["sdist", "wheel"] },
    { path = "src/ai_firmware_agent/templates/*.j2", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.11"
shared-llm-core = { path = "../000shared-llm-core", develop = true }
click = "^8.1.7"
rich = "^13.7.1"
httpx = ">=0.27.0,<0.28.0"
jinja2 = "^3.1.6"
matplotlib = "^3.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-mock = "^3.14.0"
ruff = ">=0.9,<1.0"
mypy = ">=1.14,<2.0"
types-pyyaml = "^6.0.12"
jsonschema = "^4.23.0"

[tool.poetry.scripts]
firmware-agent = "ai_firmware_agent.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
markers = [
    "integration: opt-in tests requiring external analysis tools",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "UP"]
ignore = ["E501", "E702"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["UP037"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
